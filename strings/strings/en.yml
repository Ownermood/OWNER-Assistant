# Style guide for this file (keep it consistent when you add text):
# - Plain, friendly English. Short sentences. Say what happened and what to do next.
# - No small-caps fonts, no "u/ur/plz", no "him/his" (use "them").
# - Keep every {} and {i} exactly as it is - the code fills them in.

