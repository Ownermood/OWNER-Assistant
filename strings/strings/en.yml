# Help Menus
# Format: "• `{i}command <what to give>`" then one plain line saying what it does,
# and an example when it helps. {i} becomes your command prefix (usually ".").

cmda: "📖 **Commands**"
help_admintools: "\n\n• `{i}promote` (reply, or add @username)\n    Make someone an admin.\n• `{i}demote` (reply, or add @username)\n    Remove someone as admin.\n\n• `{i}ban <reason>` (reply, or add @username)\n    Ban someone from the group.\n• `{i}unban` (reply, or add @username)\n    Let a banned person join again.\n\n• `{i}kick <reason>` (reply, or add @username)\n    Remove someone. They can join again later.\n\n• `{i}pin` (reply to a message)\n    Pin that message.\n• `{i}tpin <time> <message>`\n    Pin a message for a short time only.\n• `{i}unpin` (reply) or `{i}unpin all`\n    Unpin one message, or all of them.\n\n• `{i}pinned`\n    Show the pinned message.\n• `{i}listpinned`\n    Show all pinned messages.\n\n• `{i}autodelete <24h / 7d / 1m / off>`\n    Delete new messages in this chat automatically after that time.\n\n• `{i}purge` (reply to a message)\n    Delete every message from that one down to now.\n• `{i}purgeme` (reply to a message)\n    Same, but only your own messages.\n• `{i}purgeall` (reply to someone)\n    Delete all messages from that person.\n"
help_afk: "\n\n• `{i}afk <reason (optional)>`\n    Turn on away mode. If someone messages or tags you, they get an automatic reply.\n    Send any message to turn it off.\n    Example: `{i}afk studying for exams`\n\n    Tip: reply to a photo or GIF with `{i}afk <reason>` to show it in the reply.\n"
help_antiflood: "\n\n• `{i}setflood <number>`\n    Mute people who send more than this many messages in a row.\n    Example: `{i}setflood 5`\n\n• `{i}remflood`\n    Turn the flood limit off.\n\n• `{i}getflood`\n    See the current flood limit.\n"
help_asstcmd: "\n\n• `{i}addcmd <word>` (reply to a message)\n    Make a new /command for your assistant bot. It answers with the message you replied to.\n    Example: `{i}addcmd rules`  →  people can send /rules\n\n• `{i}remcmd <word>`\n    Delete that command.\n\n• `{i}listcmd`\n    See all your commands.\n"
help_audiotools: "\n\n• `{i}makevoice` (reply to an audio)\n    Turn an audio file into a voice note.\n\n• `{i}atrim <start>-<end>`\n    Cut an audio. Times are in seconds.\n    Example: `{i}atrim 50-70`\n\n• `{i}extractaudio` (reply to a video)\n    Get the sound from a video as an audio file.\n"
help_autoban: "\n\n• `{i}autokick on` / `{i}autokick off`\n    Automatically remove everyone who joins the group.\n"
help_autopic: "\n\n• `{i}autopic <topic>`\n    Change your profile photo every few minutes with pictures of that topic.\n    Example: `{i}autopic mountains`\n\n• `{i}autopic`\n    Stop it.\n\n• To change how often: `{i}setdb SLEEP_TIME <seconds>`\n"
help_beautify: "\n\n• `{i}carbon <text>` (or reply to a message or text file)\n    Turn text or code into a nice-looking image.\n\n• `{i}rcarbon <text>`\n    Same, with a random background colour.\n\n• `{i}ccarbon <colour> <text>`\n    Same, with the colour you choose.\n    Example: `{i}ccarbon red hello`\n\n• `{i}rayso <theme> <text>` (or reply to a message)\n    Another code-image style.\n• `{i}rayso list`\n    See the themes.\n"
help_blacklist: "\n\n• `{i}blacklist <word>`\n    Delete any message in this chat that has this word. You can give many words with spaces.\n\n• `{i}remblacklist <word>`\n    Remove a word from the list.\n\n• `{i}listblacklist`\n    See all blocked words.\n\n    You must be an admin in the chat for this to work.\n"
help_bot: "\n\n• `{i}alive` | `{i}alive inline`\n    Check that your bot is running.\n\n• `{i}ping`\n    See how fast the bot replies.\n\n• `{i}botpic` (reply to a photo, optional)\n    Change your assistant bot's profile photo.\n\n• `{i}update`\n    Check for new updates.\n\n• `{i}cmds`\n    List all plugin names.\n\n• `{i}restart`\n    Restart the bot.\n\n• `{i}logs`\n    Get the bot's log file (useful when something breaks).\n• `{i}logs carbon`\n    Get the logs as an image.\n• `{i}logs heroku`\n    Get the last 100 lines of Heroku logs.\n\n• `{i}shutdown`\n    Turn the bot off.\n"
help_broadcast: "\n\n• `{i}addch` (or `{i}addch <chat id>`)\n    Add this chat (or the given one) to your broadcast list.\n\n• `{i}remch` / `{i}remch <chat id>` / `{i}remch all`\n    Remove this chat, the given one, or all chats from the list.\n\n• `{i}broadcast` (reply to a message)\n    Send that message to every chat in your list.\n\n• `{i}forward` (reply to a message)\n    Forward that message to every chat in your list.\n\n• `{i}listchannels`\n    See your list.\n"
help_button: "\n\n• `{i}button <text with buttons>`\n    Send a message with link buttons. You can also reply to a photo.\n\n    Write each button as `[Name | link]`. Put `| same` at the end to keep it on the same row.\n    Example:\n    `{i}button Hey there! 😎\n[Google | https://google.com][YouTube | https://youtube.com | same]\n[Instagram | https://instagram.com]`\n"
help_calculator: "\n\n• `{i}calc`\n    Open a calculator with buttons.\n"
help_channelhacks: "\n\n🔹 **Copy old posts**\n• `{i}shift <from channel> | <to channel>`\n    Copy all old posts from one channel to another.\n    Example: `{i}shift @abc | @xyz` (the ` | ` is needed)\n\n🔹 **Auto-forward new posts**\nNew posts in a *source* channel are copied to your *destination* channels.\n\n• `{i}asource <channel>` - add a source channel\n• `{i}dsource <channel>` - remove a source channel\n• `{i}listsource` - see source channels\n\n• `{i}adest <channel>` - add a destination channel\n• `{i}ddest <channel>` - remove a destination channel\n• `{i}listdest` - see destination channels\n\n    You can add many channels. Use a username or ID.\n    To turn auto-forwarding on: `{i}setdb AUTOPOST True`\n"
help_chatbot: "\n\n• `{i}addai` (reply, or add @username)\n    Let AI reply to this person for you.\n\n• `{i}remai` (reply, or add @username)\n    Stop AI replies for them.\n\n• `{i}repai` (reply to a message)\n    Send one AI-written reply to that message.\n\n• `{i}listai`\n    See who has AI replies on.\n"
help_chats: "\n\n• `{i}delchat` (or `{i}delchat <username/id>`)\n    Delete this group (you must be its owner).\n\n• `{i}getlink`\n    Get an invite link for this group.\n• `{i}getlink r` - link where admins must approve joins\n• `{i}getlink r <title>` - same, with a link title\n• `{i}getlink 10` - link that only 10 people can use\n\n• `{i}create g <name>` - make a new group\n• `{i}create c <name>` - make a new channel\n• `{i}create b <name>` - make a small basic group\n    Add `; <username>` at the end to give it a public username.\n\n• `{i}setgpic` (reply to a photo)\n    Change the group's photo.\n• `{i}delgpic`\n    Remove the group's photo.\n\n• `{i}unbanall`\n    Unban everyone in the group.\n\n• `{i}rmusers`\n    Remove members by type (deleted accounts, bots, etc.).\n"
help_cleanaction: "\n\n• `{i}addclean`\n    In this chat, delete service messages like 'X joined', 'X left' or 'X pinned a message'.\n\n• `{i}remclean`\n    Stop doing that here.\n\n• `{i}listclean`\n    See the chats where it's on.\n"
help_compressor: "\n\n• `{i}compress` (reply to a video)\n    Make a video smaller.\n\n• `{i}compress <number>` (reply to a video)\n    Choose the quality. Lower number = better quality but bigger file. Default is 27.\n    Example: `{i}compress 23`\n\n• `{i}compress <number> stream`\n    Send the result as a playable video.\n"
help_converter: "\n\n• `{i}convert <gif / img / sticker / webm>` (reply to media)\n    Change a photo, sticker or video into another type.\n    Example: `{i}convert gif`\n\n• `{i}doc <file name>` (reply to a text message)\n    Save the text as a file.\n    Example: `{i}doc notes.txt`\n\n• `{i}open` (reply to a file)\n    Show the text inside a file.\n\n• `{i}rename <new name>` (reply to a file)\n    Rename a file. Include the extension, like `.pdf`.\n\n• `{i}thumbnail` (reply to an image)\n    Use this image as the cover for files you upload.\n"
help_core: "\n\n• `{i}install` (reply to a plugin file)\n    Add a new plugin.\n• `{i}install f`\n    Force install it.\n\n• `{i}uninstall <name>`\n    Remove a plugin you added.\n\n• `{i}load <name>`\n    Turn on a plugin you turned off.\n\n• `{i}unload <name>`\n    Turn off a plugin you added (until restart).\n\n• `{i}help <name>`\n    Show the help for any plugin.\n    Example: `{i}help afk`\n\n• `{i}getaddons <raw link>`\n    Install a plugin from a link.\n"
help_database: "\n\n⚠️ **Advanced - only use these if you know what you're changing.**\n\n• `{i}setdb <name> <value>`\n    Save a setting.\n    Example: `{i}setdb PMWARNS 3`\n    Use ` | ` if the value has spaces: `{i}setdb ALIVE_TEXT | I'm online!`\n    Add `-e` to add to the existing value: `{i}setdb -e <name> <value>`\n\n• `{i}deldb <name>`\n    Delete a setting.\n\n• `{i}rendb <old name> | <new name>`\n    Rename a setting.\n"
help_devtools: "\n\n⚠️ **Advanced - these run code on your server.**\n\n• `{i}bash <command>`\n    Run a Linux command.\n• `{i}bash -c <command>`\n    Same, but show the result as an image.\n\n• `{i}eval <code>`\n    Run Python code.\n    Shortcuts you can use:\n        client = bot = event.client\n        e = event\n        p = print\n        reply = await event.get_reply_message()\n        chat = event.chat_id\n\n• `{i}cpp <code>`\n    Run C++ code.\n\n• `{i}sysinfo`\n    See your server's details.\n"
help_downloadupload: "\n\n• `{i}ul <path to file>`\n    Send a file from the server to Telegram.\n    Extra options (add before or after the path):\n      `--stream` - send as a playable video/audio\n      `--delete` - delete the file after sending\n      `--no-thumb` - send without a cover image\n\n• `{i}dl <file name (optional)>` (reply to a file)\n    Save a Telegram file to the server.\n\n• `{i}download <link> | <file name (optional)>`\n    Download a file from a direct link.\n"
help_echo: "\n\n• `{i}addecho` (reply to someone)\n    Repeat everything this person says.\n\n• `{i}remecho` (reply to someone)\n    Stop repeating them.\n\n• `{i}listecho`\n    See who is being echoed.\n"
help_extra: "\n\n• `{i}del` (reply to a message)\n    Delete that message.\n\n• `{i}edit <new text>`\n    Edit your last message (or the one you reply to).\n\n• `{i}copy` (reply to a message)\n    Send a copy of that message or file.\n\n• `{i}reply` (reply to someone)\n    Make your last message a reply to them.\n"
help_fakeaction: "\n\nShow a fake status at the top of the chat for some seconds.\nExample: `{i}ftyping 30` shows 'typing...' for 30 seconds.\n\n• `{i}ftyping <seconds>` - typing...\n• `{i}faudio <seconds>` - recording audio...\n• `{i}fvideo <seconds>` - sending video...\n• `{i}fgame <seconds>` - playing a game...\n• `{i}fsticker <seconds>` - choosing a sticker...\n• `{i}flocation <seconds>` - sending location...\n• `{i}fcontact <seconds>` - choosing a contact...\n• `{i}fround <seconds>` - recording a video message...\n• `{i}fphoto <seconds>` - sending a photo...\n• `{i}fdocument <seconds>` - sending a file...\n"
help_fedutils: "\n\nFor Rose bot federations.\n\n• `{i}superfban` (reply, or add @username / ID)\n    Fed-ban someone in every fed where you're an admin.\n\n• `{i}superunfban` (reply, or add @username / ID)\n    Remove that fed-ban everywhere.\n\n    You can set a fed-ban group and feds to skip in your assistant bot's settings.\n\n• `{i}fstat` (reply, or add @username / ID)\n    See which feds someone is banned in.\n\n• `{i}fedinfo <fed id (optional)>`\n    See info about a fed (or the fed you own).\n"
help_fileshare: "\n\n• `{i}store` (reply to a message or file)\n    Save it and get a share link. Anyone with the link can get it from your assistant bot.\n\n• `{i}delstored <link>`\n    Delete a stored file.\n\n• `{i}liststored`\n    See all your stored files.\n\n• Type your assistant bot's username and then `filestore` in any chat to see them there.\n"
help_filter: "\n\n• `{i}addfilter <word>` (reply to a message)\n    When someone says this word in the chat, I reply with that message.\n    Example: `{i}addfilter hello`\n\n• `{i}remfilter <word>`\n    Delete a filter.\n\n• `{i}listfilter`\n    See all filters in this chat.\n"
help_fontgen: "\n\n• `{i}font <font name> : <text>`\n    Write text in a fancy font.\n    Example: `{i}font bold : hello`\n\n• `{i}font`\n    See all fonts.\n"
help_giftools: "\n\n• `{i}invertgif` (reply to a GIF)\n    Invert the colours.\n\n• `{i}bwgif` (reply to a GIF)\n    Make it black and white.\n\n• `{i}rvgif` (reply to a GIF)\n    Play it backwards.\n\n• `{i}vtog` (reply to a video)\n    Turn a video into a GIF.\n\n• `{i}gif <search>`\n    Find and send a GIF.\n    Example: `{i}gif happy dance`\n"
help_globaltools: "\n\nThese work in every group where you're an admin.\n\n• `{i}gban` / `{i}ungban` (reply, or add @username)\n    Ban or unban someone everywhere.\n• `{i}gstat` (reply, or add @username)\n    Check if someone is globally banned.\n• `{i}listgban`\n    See everyone you've globally banned.\n\n• `{i}gmute` / `{i}ungmute` (reply, or add @username)\n    Mute or unmute someone everywhere.\n• `{i}gkick` (reply, or add @username)\n    Kick someone from every group.\n\n• `{i}gcast <text>` (or reply)\n    Send a message to all your groups.\n• `{i}gadmincast <text>` (or reply)\n    Send it only to groups where you're an admin.\n• `{i}gucast <text>` (or reply)\n    Send it to all your private chats.\n    ⚠️ Sending to many chats at once can get your account limited. Use it rarely.\n\n• `{i}gblacklist` (or `{i}gblacklist <chat>`)\n    Skip this chat in all global messages.\n• `{i}ungblacklist`\n    Stop skipping it.\n\n• `{i}gpromote <group / channel / all> <title>` (reply to someone)\n    Make someone an admin everywhere you can.\n    Example: `{i}gpromote group boss`\n• `{i}gdemote` (reply to someone)\n    Remove them as admin everywhere.\n"
help_greetings: "\n\n**Welcome**\n• `{i}setwelcome <message>` (or reply to a message)\n    Greet new members with this message.\n• `{i}getwelcome`\n    See the welcome message.\n• `{i}clearwelcome`\n    Delete it.\n\n**Goodbye**\n• `{i}setgoodbye <message>` (or reply to a message)\n    Send this when someone leaves.\n• `{i}getgoodbye`\n    See the goodbye message.\n• `{i}cleargoodbye`\n    Delete it.\n\n• `{i}thankmembers on` / `off`\n    Send a thank-you sticker every time the group reaches another 100 members.\n"
help_imagetools: "\n\nReply to a photo or sticker with any of these:\n\n• `{i}border` - add a border\n    Example: `{i}border 12,22,23 ; 5` (colour as R,G,B ; width)\n• `{i}grey` - black and white\n• `{i}color` - add colour to a black and white photo\n• `{i}toon` - cartoon look\n• `{i}danger` - red danger look\n• `{i}negative` - negative colours\n• `{i}blur` - blur it\n• `{i}quad` - swirl effect\n• `{i}mirror` - mirror image\n• `{i}flip` - flip upside down\n• `{i}sketch` - pencil sketch\n• `{i}blue` - blue look\n• `{i}pixelator` - pixel look\n\n• `{i}csample <colour>`\n    Show a sample of a colour.\n    Example: `{i}csample red` or `{i}csample #ffffff`\n"
help_instagram: "\n\n• `{i}instadl <Instagram link>`\n    Download a post or reel.\n\n• `{i}instadata <username>`\n    See someone's Instagram profile details.\n\n• `{i}instaul <caption>` (reply to a photo/video)\n    Post it to your Instagram.\n• `{i}igtv <caption>` (reply to a video)\n    Post it as IGTV.\n• `{i}reels <caption>` (reply to a video)\n    Post it as a reel.\n\n• Type your assistant bot's username and then `instatm` to see your feed.\n\n    First set `INSTA_USERNAME` and `INSTA_PASSWORD` with `{i}setdb`.\n"
help_locks: "\n\n• `{i}lock <what>`\n    Stop members from sending this in the group.\n• `{i}unlock <what>`\n    Allow it again.\n\n    You can lock: msgs, media, sticker, gif, games, inline, polls, invites, pin, changeinfo\n    Example: `{i}lock sticker`\n"
help_logo: "\n\n• `{i}logo <text>`\n    Make a logo with your text.\n    Reply to a photo to write the text on it.\n    Reply to a font file to use that font.\n"
help_mediatools: "\n\n• `{i}mediainfo` (reply to a file)\n    See details like size, length and quality.\n\n• `{i}rotate <degrees>` (reply to a photo/video)\n    Turn it. For videos use 90, 180 or 270.\n"
help_misc: "\n\n• `{i}eod`\n    See what happened on this day in history.\n\n• `{i}pntrst <link>`\n    Download a Pinterest pin.\n\n• `{i}gadget <name>`\n    Search for a phone or gadget.\n\n• `{i}randomuser`\n    Make up details for a random fake person.\n\n• `{i}ascii` (reply to a photo)\n    Turn a photo into ASCII art.\n"
help_mute: "\n\n• `{i}mute` (reply, or add user ID)\n    Stop someone from sending messages here.\n\n• `{i}unmute` (reply, or add user ID)\n    Let them talk again.\n\n• `{i}dmute` (reply, or add user ID)\n    Mute someone by deleting every message they send.\n• `{i}undmute` (reply, or add user ID)\n    Stop that.\n\n• `{i}tmute <time>` (reply, or add user ID)\n    Mute for a while. Use s, m, h or d.\n    Example: `{i}tmute 2h`\n"
help_notes: "\n\n• `{i}addnote <word>` (reply to a message)\n    Save a note in this chat. Anyone can get it by typing `#word`.\n    Example: `{i}addnote rules`  →  type `#rules`\n\n• `{i}remnote <word>`\n    Delete a note.\n\n• `{i}listnote`\n    See all notes in this chat.\n"
help_other: "\n\n• `{i}send <username / id> <message>` (or reply to a message)\n    Send a message to another chat.\n\n• `{i}fwdreply` (reply to a message)\n    Reply to that person in your private chat with them.\n\n• `{i}save` (reply to a message)\n    Copy it to your Saved Messages.\n\n• `{i}fsave` (reply to a message)\n    Forward it to your Saved Messages.\n"
help_pmpermit: "\n\nPM security: strangers can't keep messaging you until you approve them.\n\n• `{i}a` or `{i}approve`\n    Allow this person to message you.\n\n• `{i}da` or `{i}disapprove`\n    Take that permission back.\n\n• `{i}block` / `{i}unblock`\n    Block or unblock someone.\n• `{i}unblock all`\n    Unblock everyone.\n\n• `{i}logpm` / `{i}nologpm`\n    Start or stop saving this person's messages in your log group.\n\n• `{i}startarchive` / `{i}stoparchive`\n    Move new PMs to the archive, or stop doing that.\n• `{i}cleararchive`\n    Take all chats out of the archive.\n\n• `{i}listapproved`\n    See everyone you've approved.\n"
help_polls: "\n\n• `{i}poll <question> ; <option> ; <option>`\n    Make a poll.\n    Example: `{i}poll Tea or coffee? ; Tea ; Coffee`\n\n• Add `| <type>` at the end to change the kind of poll:\n    `| public` - show who voted\n    `| multiple` - allow more than one answer\n    `| quiz_2` - a quiz where option 2 is correct\n"
help_profanityfilter: "\n\n• `{i}addprofanity`\n    Delete messages with bad words in this chat.\n\n• `{i}remprofanity`\n    Turn that off.\n"
help_profile: "\n\n• `{i}setname <first name> // <last name>`\n    Change your name.\n    Example: `{i}setname Rohit // Sharma`\n\n• `{i}setbio <text>`\n    Change your bio.\n\n• `{i}setpic` (reply to a photo)\n    Change your profile photo.\n\n• `{i}delpfp` (or `{i}delpfp <number>`)\n    Delete your latest profile photo (or that many photos).\n\n• `{i}poto <username>`\n    Get someone's profile photo.\n"
help_qrcode: "\n\n• `{i}qrcode <text>` (or reply to a message)\n    Make a QR code.\n\n• `{i}addqr <text>` (reply to a photo)\n    Make a QR code and put it on the photo.\n\n• `{i}qrdecode` (reply to a QR code)\n    Read what the QR code says.\n"
help_resize: "\n\n• `{i}size` (reply to a photo)\n    See its width and height.\n\n• `{i}resize <width> <height>` (reply to a photo)\n    Change its size.\n    Example: `{i}resize 690 960`\n"
help_schedulemsg: "\n\n• `{i}schedule <message> <time>` (or reply to a message)\n    Send a message later.\n    Time can be seconds (`100`), minutes (`10m`) or hours (`1h`).\n    Example: `{i}schedule Hello 1h`\n"
help_search: "\n\n• `{i}saavn <song>`\n    Download a song from JioSaavn.\n\n• `{i}google <search>`\n    Search Google.\n\n• `{i}github <username>`\n    See someone's GitHub profile.\n\n• `{i}img <search>`\n• `{i}img <search> ; <how many>`\n    Search for pictures.\n    Example: `{i}img red rose ; 5`\n\n• `{i}reverse` (reply to a photo or sticker)\n    Find where a picture comes from.\n"
help_snips: "\n\n• `{i}addsnip <word>` (reply to a message)\n    Save a quick reply. Type `$word` anywhere to send it.\n    Example: `{i}addsnip hi`  →  type `$hi`\n\n• `{i}remsnip <word>`\n    Delete a snip.\n\n• `{i}listsnip`\n    See all snips.\n"
help_specialtools: "\n\n• `{i}wspr @username <message>` (or reply to someone with `{i}wspr <message>`)\n    Send a secret message in any chat. Only that person (and you) can open it. Up to 200 characters.\n    `{i}wspr @username` alone shows their profile card.\n\n• `{i}q` (reply to a message)\n    Turn messages into a quote sticker.\n    `{i}q <colour>` - choose the background colour\n    `{i}q 3` - quote 3 messages together (up to 20)\n    `{i}q r` - include the message it replied to\n\n• `{i}sticker <search>`\n    Find stickers.\n\n• `{i}getaudio` (reply to an audio)\n    Pick an audio to add to a video.\n• `{i}addaudio` (reply to a video or GIF)\n    Put that audio on this video.\n\n• `{i}dob <dd/mm/yyyy>`\n    See age and birthday details.\n    Example: `{i}dob 01/01/2008`\n\n• `{i}wall <search>`\n    Find HD wallpapers.\n"
help_stickertools: "\n\n• `{i}kang` (reply to a photo or sticker)\n    Add it to your own sticker pack.\n\n• `{i}packkang <pack name>` (reply to a sticker)\n    Copy the whole sticker pack into a new pack of yours.\n\n• `{i}tiny` (reply to a photo or sticker)\n    Make a tiny sticker.\n\n• `{i}round` (reply to a photo or video)\n    Make a round sticker.\n\n• `{i}destroy` (reply to an animated sticker)\n    Mess up an animated sticker for fun.\n"
help_sudo: "\n\nSudo users can use your bot's commands. Only add people you fully trust.\n\n• `{i}addsudo` (reply, or add user IDs with spaces)\n    Add sudo users.\n\n• `{i}delsudo` (reply, or add user IDs with spaces)\n    Remove sudo users.\n\n• `{i}listsudo`\n    See all sudo users.\n"
help_tag: "\n\n• `{i}tagall` - tag up to 100 members\n• `{i}tagadmins` - tag the admins\n• `{i}tagowner` - tag the group owner\n• `{i}tagbots` - tag the bots\n• `{i}tagrec` - tag recently active members\n• `{i}tagon` - tag members who are online\n• `{i}tagoff` - tag members who are offline\n\n    Online/offline only works for people who show their last seen.\n    ⚠️ Don't tag too often - people get annoyed and may report you.\n"
help_tools: "\n\n• `{i}id`\n    Get an ID. Reply to a person or sticker for theirs, or send it alone for the chat's ID.\n\n• `{i}sg` (reply, or add username/ID)\n    See someone's old names and usernames.\n\n• `{i}tr <language code>` (reply to a message)\n    Translate it.\n    Example: `{i}tr hi` (Hindi) or `{i}tr en` (English)\n\n• `{i}webshot <link>`\n    Take a screenshot of a website.\n\n• `{i}shorturl <link>`\n    Make a short link.\n\n• `{i}circle` (reply to an audio or GIF)\n    Turn it into a round video message.\n\n• `{i}hl <link> <text (optional)>`\n    Hide a link behind text.\n\n• `{i}bots`\n    List the bots in this chat.\n\n• `{i}ls`\n    See the files in a folder on your server.\n"
help_unsplash: "\n\n• `{i}unsplash <search> ; <how many>`\n    Get free photos from Unsplash.\n    Example: `{i}unsplash beach ; 3`\n"
help_usage: "\n\n• `{i}usage`\n    See your server's CPU, RAM, disk and data use.\n\n• `{i}usage heroku`\n    See Heroku usage.\n\n• `{i}usage db`\n    See how much database space is used.\n"
help_utilities: "\n\n• `{i}info` (reply, or add username/ID)\n    See details about a person or chat.\n\n• `{i}stats`\n    See how many chats, groups and channels you have.\n\n• `{i}date`\n    Show today's date and a calendar.\n\n• `{i}kickme`\n    Leave this group.\n\n• `{i}invite <username / id>`\n    Add someone to this group.\n\n• `{i}listreserved`\n    See the public usernames (groups/channels) you own.\n\n• `{i}paste <text>` (or reply to a text file)\n    Upload long text and get a link.\n\n• `{i}telegraph` (reply to a photo or text)\n    Upload it to Telegraph and get a link.\n\n• `{i}rmbg` (reply to a photo)\n    Remove the background from a photo.\n\n• `{i}suggest` (reply to a message, or add a question)\n    Make a quick Yes/No poll.\n\n• `{i}cpy` (reply to a message) then `{i}pst`\n    Copy a message with its formatting, then paste it anywhere. Works for 24 hours.\n\n• `{i}getmsg <message link>`\n    Get a message from a chat that blocks forwarding or saving.\n\n• `{i}thumb` (reply to a file)\n    Get the file's cover image.\n\n• `{i}ipinfo <IP address>`\n    See where an IP address is from.\n\n• `{i}json` (reply to a message)\n    See the message's raw data (for developers).\n"
help_variables: "\n\n⚠️ **Advanced.**\n\n• `{i}get var <name>`\n    See the value of a setting.\n\n• `{i}get type <name>`\n    See what type of value it is.\n\n• `{i}get db <name>`\n    See a value saved in the database.\n\n• `{i}get keys`\n    List all saved setting names.\n"
help_vctools: "\n\n• `{i}startvc`\n    Start a voice chat in this group.\n\n• `{i}stopvc`\n    End the voice chat.\n\n• `{i}vctitle <title>`\n    Change the voice chat's title.\n\n• `{i}vcinvite`\n    Invite all group members to the voice chat. (Join it yourself first.)\n"
help_videotools: "\n\n• `{i}sample <seconds>` (reply to a video)\n    Make a short clip from the video.\n\n• `{i}vshots <number>` (reply to a video)\n    Take that many screenshots from the video.\n\n• `{i}vtrim <start> - <end>` (reply to a video)\n    Cut the video. Times are in seconds.\n    Example: `{i}vtrim 10 - 40`\n"
help_warn: "\n\n• `{i}warn <reason>` (reply to someone)\n    Give a warning. Too many warnings and they get punished.\n\n• `{i}resetwarn` (reply to someone)\n    Clear all their warnings.\n\n• `{i}warns` (reply to someone)\n    See their warnings.\n\n• `{i}setwarn <number> | <ban / mute / kick>`\n    Choose how many warnings are allowed and what happens after.\n    Example: `{i}setwarn 5 | mute`\n    Default: 3 warnings, then kick.\n"
help_webupload: "\n\n• `{i}webupload` (reply to a file)\n    Upload a file to a website and get a download link.\n"
help_words: "\n\n• `{i}meaning <word>`\n    Get the meaning of a word.\n    Example: `{i}meaning eloquent`\n\n• `{i}synonym <word>`\n    Words with the same meaning.\n\n• `{i}antonym <word>`\n    Words with the opposite meaning.\n\n• `{i}ud <word>`\n    Look up slang on Urban Dictionary.\n"
help_ziptools: "\n\n• `{i}zip` (reply to a file)\n    Put the file in a .zip.\n    Add a password: `{i}zip <password>`\n\n• `{i}unzip` (reply to a .zip file)\n    Open a .zip and send the files inside.\n\n• `{i}addzip` (reply to a file)\n    Add a file to a list to zip together later.\n\n• `{i}dozip`\n    Zip all files you added with `{i}addzip`.\n    Add a password: `{i}dozip <password>`\n"
