# Easiest local / VPS setup:
#   1. cp .env.sample .env   and fill SESSION (and API_ID/API_HASH)
#   2. docker compose up -d --build
# A Redis database is started for you automatically, nothing else to set.
services:
  ultroid:
    build: .
    env_file: .env
    environment:
      # use the bundled redis unless you gave your own DB in .env
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
    volumes:
      # OWNER Manager keeps the session you log in with here (survives rebuilds)
      - owner-data:/root/OWNER-Assistant/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  owner-data:
